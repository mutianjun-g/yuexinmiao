<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月薪喵 · 我真的特别爱你</title>
<meta name="description" content="一只会跟着音乐流泪的月薪喵。">
<meta name="theme-color" content="#141118">
<meta property="og:title" content="月薪喵 · 我真的特别爱你">
<meta property="og:description" content="一只会跟着音乐流泪的月薪喵。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="hearts" id="hearts"></div>
</div>

<header class="brand">
  <span class="brand-dot"></span>
  <span class="brand-name">月薪喵</span>
</header>

<main class="app">
  <section class="stage waiting">
    <div class="cat">
      <div class="cat-glow" aria-hidden="true"></div>
      <img src="assets/cat.gif" alt="月薪喵" draggable="false">
    </div>

    <p class="lyric" id="lyric">我真的特别爱你</p>

    <div class="progress" id="progress" role="slider" aria-label="播放进度" tabindex="0">
      <div class="track"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </section>
</main>

<p class="hint" id="hint">空格 播放 / 暂停 &nbsp;·&nbsp; M 静音</p>

<div class="controls">
  <button class="icon-btn small" id="muteBtn" type="button" aria-label="静音">
    <svg class="ic-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9v6h3.5L13 19V5L7.5 9H4z"/><path d="M17 9.5a3.5 3.5 0 0 1 0 5"/><path d="M19.5 7a7 7 0 0 1 0 10"/>
    </svg>
    <svg class="ic-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" hidden>
      <path d="M4 9v6h3.5L13 19V5L7.5 9H4z"/><path d="M17 9.5l4 5"/><path d="M21 9.5l-4 5"/>
    </svg>
  </button>

  <button class="icon-btn play" id="toggleBtn" type="button" aria-label="播放">
    <svg class="ic-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
      <rect x="7" y="5" width="3.4" height="14" rx="1.4"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.4"/>
    </svg>
    <svg class="ic-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" hidden>
      <path d="M8 5.6a1 1 0 0 1 1.53-.85l9 6.4a1 1 0 0 1 0 1.7l-9 6.4A1 1 0 0 1 8 18.4V5.6z"/>
    </svg>
  </button>
</div>

<div class="veil" id="veil" role="button" tabindex="0" aria-label="点击开始播放">
  <div class="veil-inner">
    <div class="orb">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#ffb3cd">
        <path d="M9 6.2a1 1 0 0 1 1.52-.85l7.4 5.8a1 1 0 0 1 0 1.7l-7.4 5.8A1 1 0 0 1 9 17.8V6.2z"/>
      </svg>
    </div>
    <p class="veil-title">我真的特别爱你</p>
    <p class="veil-sub">点击任意处开始</p>
  </div>
</div>

<audio id="audio" src="assets/music.mp3" preload="auto" loop></audio>
<script src="app.js"></script>
</body>
</html>
